<?xml version="1.0" encoding="utf-8"?>
<!-- AES CERT · badge cyber (shield + oeil absolu) — logo de fin du room tour -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a2b"/>
      <stop offset="1" stop-color="#040b14"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35e0ff"/>
      <stop offset="0.35" stop-color="#1a9fd4"/>
      <stop offset="1" stop-color="#062033"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ln { fill: none; stroke: #35e0ff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ln2 { fill: none; stroke: rgba(53,224,255,0.5); stroke-width: 0.8; stroke-linecap: round; }
      .txt { fill: #d8f3ff; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 2.5px; }
      .scan { stroke: rgba(53,224,255,0.10); stroke-width: 1; }
    </style>
  </defs>

  <!-- fond badge -->
  <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#bg)"/>
  <!-- scanlines discrètes -->
  <g>
    <line class="scan" x1="8" y1="18" x2="88" y2="18"/>
    <line class="scan" x1="8" y1="30" x2="88" y2="30"/>
    <line class="scan" x1="8" y1="66" x2="88" y2="66"/>
    <line class="scan" x1="8" y1="78" x2="88" y2="78"/>
  </g>

  <!-- coins HUD -->
  <g class="ln2">
    <path d="M10 10 h8 M10 10 v8"/>
    <path d="M86 10 h-8 M86 10 v8"/>
    <path d="M10 86 h8 M10 86 v-8"/>
    <path d="M86 86 h-8 M86 86 v-8"/>
  </g>

  <!-- bouclier -->
  <path class="ln" filter="url(#glow)" d="M48 16 L76 26 V46 c0 16 -11 27 -28 34 C31 73 20 62 20 46 V26 Z"/>

  <!-- oeil absolu -->
  <g filter="url(#glow)">
    <path class="ln" d="M30 44 Q48 30 66 44 Q48 56 30 44 Z"/>
    <circle cx="48" cy="43.5" r="7.5" fill="url(#iris)"/>
    <circle cx="48" cy="43.5" r="7.5" fill="none" stroke="#9ceaff" stroke-width="1"/>
    <circle cx="48" cy="43.5" r="2.6" fill="#04121e"/>
    <!-- reflet -->
    <circle cx="45.4" cy="41" r="1.3" fill="#eaffff" opacity="0.9"/>
    <!-- paupieres prolongees -->
    <line class="ln" x1="27" y1="44" x2="30" y2="44"/>
    <line class="ln" x1="66" y1="44" x2="69" y2="44"/>
  </g>

  <!-- wordmark -->
  <text class="txt" x="48" y="67" font-size="10.5" font-weight="700" text-anchor="middle">AES</text>
  <text class="txt" x="49.2" y="78" font-size="6.5" text-anchor="middle" opacity="0.85" letter-spacing="3.2">CERT</text>
</svg>
